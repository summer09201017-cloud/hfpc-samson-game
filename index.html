    <div id="stage">
      <canvas id="game"></canvas>
      <!-- 🏷 改版簡歷(VT2 0916):彈窗本體在本檔下面徽章那一段;這顆只負責打開它。
           用站自己的 .icon-btn 樣式,排在靜音鈕左邊,不另做一套浮動鈕。 -->
      <button id="appVerOpen" class="icon-btn ver-btn" aria-label="改版簡歷" title="改版簡歷・看看前幾版做了什麼">🏷️</button>
      <button id="muteBtn" class="icon-btn mute-btn" aria-label="靜音" title="靜音 (M)">🔊</button>

    <!-- 手機直向時蓋住畫面,提示轉成橫向(只在觸控裝置的直向顯示) -->

      <div class="rotate-emoji">🔄</div>
      <p>請把手機轉成<b>橫向</b>來玩<br /><span>轉成橫向會自動全螢幕</span></p>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // play-stats 三層匿名計數(lobby-play-rank §3/§4):開啟 10 分去重;-start/-done 不去重;-done 帶 t=秒。零個資。
      window.psPing = function (key, t) {
        try {
          if (['localhost', '127.0.0.1'].includes(location.hostname)) return;
          var u = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=' + key + (t ? '&t=' + t : '');
          if (navigator.sendBeacon) navigator.sendBeacon(u); else fetch(u, { mode: 'no-cors' });
        } catch (_) {}
      };
      try {
        var psK = 'ps-last-samson';
        var psLast = parseInt(localStorage.getItem(psK) || '0', 10);
        if (Date.now() - psLast > 600000) { localStorage.setItem(psK, String(Date.now())); window.psPing('samson'); }
      } catch (_) { window.psPing('samson'); }
    </script>
  
<script>
// ← 返回大廳(skill back-to-lobby-button):孩子卡住要能離開。DOM 疊在畫面上,不畫進 canvas。
// 退出 ≠ 過關:這裡只導頁,絕不呼叫 onComplete。嵌入時先讓宿主處理。
(function () {
  var LOBBY = 'https://hfpc-bible-games.summer09201017.workers.dev';
  function go() {
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
    if (window.parent && window.parent !== window) {          // 嵌入:交給宿主收掉關卡視窗
      try { window.parent.postMessage({ type: 'hfpc-exit' }, '*'); } catch (e) {}
      if (history.length > 1) { history.back(); return; }
    }
    location.href = LOBBY;
  }
  function add() {
    if (document.querySelector('[data-hfpc-lobby]')) return;
    var b = document.createElement('button');
    b.textContent = '← 返回大廳';
    b.setAttribute('aria-label', '返回大廳');
    b.setAttribute('data-hfpc-lobby', '1');
    b.style.cssText = 'position:fixed;z-index:2147483000;' +
      'top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));' +
      'min-width:44px;min-height:44px;padding:9px 14px;border:0;border-radius:12px;' +
      'font:600 15px/1.2 system-ui,"Microsoft JhengHei",sans-serif;' +
      'background:rgba(0,0,0,.58);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent';
    b.addEventListener('click', go);
    (document.body || document.documentElement).appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', add); else add();
})();
</script>

<script>
// 真實停留打點(skill play-stats-dwell):開頁到離開,單發 samson-dwell。
// ★ 只送這一發:手機鎖屏時常只送得出佇列第一個 beacon,同一刻連發兩個會有一發被丟掉。
(function () {
  var SITE = 'samson', t0 = Date.now(), sent = false;
  function bye() {
    if (sent) return; sent = true;
    var sec = Math.round((Date.now() - t0) / 1000);
    if (sec < 3 || sec > 1800) return;                     // 誤觸不算、掛整天的背景分頁不算
    if (['localhost', '127.0.0.1', ''].indexOf(location.hostname) >= 0) return;
    try {
      navigator.sendBeacon &&
        navigator.sendBeacon('https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=' + SITE + '-dwell&t=' + sec);
    } catch (e) {}
  }
  addEventListener('pagehide', bye);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') bye(); });
})();
</script>

<script>
// 🎵 背景音樂(BGM 百曲庫 0726,skill procedural-bgm):零音檔 Web Audio。
// 曲子由站名雜湊決定=全艦隊每站不同首;有關卡的遊戲可呼叫 window.hfpcBgmLevel(n) 換曲。
// 音域 330Hz+/音量經 AnalyserNode 校正(手機喇叭放不出 500Hz 以下——0726 實測)。
(function () {
  var SITE = 'hfpc-samson-game';
  var muted = false; try { muted = localStorage.getItem('bgm-muted') === '1'; } catch (e) {}
  var ctx = null, timer = 0, step = 0, cur = null, started = false;
  function variant(lv) {
    var SC = [[523.25,587.33,659.25,783.99,880],[440,523.25,587.33,659.25,783.99],[392,440,493.88,587.33,659.25],[349.23,392,440,523.25,587.33],[587.33,659.25,739.99,880,987.77],[329.63,392,440,493.88,587.33],[466.16,523.25,587.33,698.46,783.99],[415.3,466.16,554.37,622.25,739.99]];
    var PT = [[0,1,2,3,4,3,2,1],[0,2,4,2,1,3,2,0],[4,3,2,1,0,1,2,3],[0,0,2,2,4,4,2,-1],[0,2,1,3,2,4,3,-1],[4,2,0,2,4,2,1,0],[0,3,1,4,2,0,3,-1],[2,4,2,0,1,3,4,2]];
    var x = 2166136261, s = SITE + '|' + (lv || 1);
    for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0 }
    var mul = [1, 1.122, 0.891][(x >>> 13) % 3];
    var sc = SC[x % 8].map(function (f) { return f * mul });
    var p = PT[(x >>> 3) % 8].concat(PT[(x >>> 6) % 8]);
    var wave = ['triangle', 'square', 'sine'][(x >>> 11) % 3];
    return { mel: p.map(function (i) { return i < 0 ? 0 : sc[i] }),
             bass: [0,0,3,3,4,4,3,3,0,0,3,3,4,4,0,0].map(function (i) { return sc[i] / 2 }),
             wave: wave, vol: wave === 'square' ? 0.2 : wave === 'sine' ? 0.42 : 0.32,
             ms: [190, 220, 250, 290][(x >>> 9) % 4] };
  }
  function blip(f, dur, type, vol) {
    if (muted || !ctx) return;
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + dur + 0.02);
    } catch (e) {}
  }
  function tick() {
    if (muted || !cur) return;
    var i = step % 16;
    if (cur.bass[i]) blip(cur.bass[i], cur.ms / 1000 * 1.8, 'sine', 0.02);
    if (step % 2 === 0) { var mf = cur.mel[(step / 2) % 16 | 0]; if (mf) blip(mf, cur.ms / 1000 * 1.7, cur.wave, cur.vol); }
    step++;
  }
  window.hfpcBgmLevel = function (lv) { cur = variant(lv); step = 0; if (timer) { clearInterval(timer); timer = setInterval(tick, cur.ms); } };
  function start() {
    if (started || muted) return; started = true;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    cur = cur || variant(1);
    timer = setInterval(tick, cur.ms);
  }
  addEventListener('pointerdown', function () { start(); try { if (ctx && ctx.state === 'suspended') ctx.resume(); } catch (e) {} }, { passive: true });
  document.addEventListener('visibilitychange', function () { if (!ctx) return; try { document.hidden ? ctx.suspend() : ctx.resume(); } catch (e) {} });
  // 🎵 靜音鈕(放「← 返回大廳」鈕下方,同一套視覺)
  function addBtn() {
    if (document.querySelector('[data-hfpc-bgm]')) return;
    var b = document.createElement('button');
    b.textContent = muted ? '🔇' : '🎵';
    b.setAttribute('aria-label', '開關背景音樂');
    b.setAttribute('data-hfpc-bgm', '1');
    b.style.cssText = 'position:fixed;z-index:2147483000;' +
      'top:calc(60px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));' +
      'min-width:44px;min-height:44px;border:0;border-radius:12px;font-size:17px;' +
      'background:rgba(0,0,0,.58);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent';
    b.addEventListener('click', function () {
      muted = !muted;
      try { localStorage.setItem('bgm-muted', muted ? '1' : '0'); } catch (e) {}
      b.textContent = muted ? '🔇' : '🎵';
      if (!muted) start();
    });
    (document.body || document.documentElement).appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addBtn); else addBtn();
})();
</script>
<div id="appVerBadge" style="position:fixed;right:6px;bottom:4px;font-size:11px;line-height:1;opacity:.55;z-index:2147483000;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);font-family:system-ui,sans-serif"></div>
<!-- 🏷 改版簡歷(VT2 2026-09-16 補齊 game-must-haves ⑦ 的下半件)。
     徽章只回答「我開到哪一版」,這一份回答「每一版做了什麼」——寫給家長與老師看。
     ★ 徽章維持 pointer-events:none(標籤不是按鈕);簡歷從選單那顆鈕開。
     ★ 改版時在 APP_VERSIONS 最前面插一筆就好。 -->
<style>#appVerSheet[hidden]{display:none!important}</style>
<div id="appVerSheet" hidden style="position:fixed;inset:0;z-index:2147483001;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,'Noto Sans TC',sans-serif">
  <div style="max-width:460px;width:100%;max-height:72vh;overflow-y:auto;background:#101a33;border:1px solid #33407a;border-radius:12px;padding:16px 18px;color:#e8ecff;box-shadow:0 18px 50px rgba(0,0,0,.45)">
    <h3 style="margin:0 0 4px;font-size:16px">🏷️ 改版簡歷</h3>
    <p style="margin:0 0 10px;font-size:12px;line-height:1.6;color:#a9b4e0">每一版新增了什麼,白話寫給家長與老師看。前幾版都列在下面,最新的在最上面。</p>
    <ol id="appVerList" style="margin:0;padding-left:18px;font-size:13px;line-height:1.85"></ol>
    <button type="button" id="appVerClose" style="margin-top:14px;width:100%;min-height:44px;font:inherit;color:#e8ecff;background:#2a356b;border:1px solid #3a4a8b;border-radius:8px;cursor:pointer">關閉</button>
  </div>
</div>
<script>
(function () {
  // 最新的放最前面。改版只要在這裡插一筆。
  var APP_VERSIONS = [
    {
      "v": "v6",
      "d": "2026-09-16",
      "t": "畫面右上角多一顆 🏷️ 鈕,點開就看得到每一版做了什麼。以前右下角只看得到版本號,卻看不到那一版新增了什麼。"
    },
    {
      "v": "v5",
      "d": "2026-09-14",
      "t": "修好一個「把遊戲裝成 App 之後打開是錯誤畫面」的毛病(離線存檔的首頁存錯了鍵)。這是整個系列一起修的同一種病。"
    },
    {
      "v": "v4",
      "d": "2026-08-31",
      "t": "畫面右下角開始顯示版本號,回報問題時對得上是哪一版。"
    },
    {
      "v": "v3",
      "d": "2026-08-17",
      "t": "搬到新的主機(舊網址會自動轉過來),載入更快;遊玩次數的統計在新舊網址都算得到。"
    },
    {
      "v": "v2",
      "d": "2026-07-26",
      "t": "加上「← 返回大廳」鈕,孩子玩完可以自己回到大廳,不用按瀏覽器的上一頁;背景音樂改成整個系列共用的百曲庫,每一站、每一關配到的曲子都不一樣。"
    },
    {
      "v": "v1 收尾",
      "d": "2026-06-22",
      "t": "過關、失敗、壞結局三種收場都會朗讀經文,並且唸出出處(士師記 14:5-6)——讓孩子聽見的是「耶和華的靈大大感動參孫」,不是打贏了很威風。"
    },
    {
      "v": "v1",
      "d": "2026-06-20",
      "t": "參孫打獅子(士師記 14 章)上線。設計上刻意留了幾條路給不同的孩子:💛 金色的心可以突破血量上限、蜂窩可以補血;前三次死掉會無縫復活,而且獅子的血會倒退回三十秒前(不會愈打愈絕望);右下角牆上有一個隱形的缺口,刻意停在那裡 1.2 秒就走得出去——那是「逃跑雖可恥但有用」的隱藏結局。另外也有一個壞結局:黑霧裡伸出一隻黑手抓走參孫的心。"
    }
  ];
  var sheet = document.getElementById('appVerSheet');
  var list = document.getElementById('appVerList');
  var closeBtn = document.getElementById('appVerClose');
  if (!sheet || !list || !closeBtn) return;
  var esc = function (x) {
    return String(x).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
  };
  list.innerHTML = APP_VERSIONS.map(function (r) {
    return '<li style="margin-bottom:.5em"><b>' + esc(r.v) + '</b>(' + esc(r.d) + '):' + esc(r.t) + '</li>';
  }).join('');
  function openSheet() { sheet.hidden = false; }
  function shutSheet() { sheet.hidden = true; }
  window.__openVersionSheet = openSheet;
  window.__appVersion = APP_VERSIONS[0].v + '(' + APP_VERSIONS[0].d + ')';
  // ★ 開簡歷那顆鈕**不一定在本段程式之前**就被解析完(--trigger=fixed 的 anchor 常在徽章後面)。
  //   直接 getElementById 會拿到 null,鈕就變成按了沒反應——而且靜態檢查全綠、截圖也看不出來。
  //   ⇒ 還在解析中就等 DOMContentLoaded 再綁。
  function bindOpener() {
    var b = document.getElementById('appVerOpen');
    if (b) b.addEventListener('click', openSheet);
  }
  if (document.readyState === 'loading') addEventListener('DOMContentLoaded', bindOpener);
  else bindOpener();
  closeBtn.addEventListener('click', shutSheet);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) shutSheet(); });
  addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) shutSheet(); });
})();
</script>
    <script>
      /* 🏷️ appVerBadgeFade（0828）：版號徽章是 position:fixed 在右下角，實測會蓋住大廳卡片、
         遊戲的「難度 / 開始比賽」按鈕——pointer-events:none 只讓「點擊」穿過去，字還是被蓋著。
         做法：10 秒後淡出。要看版本就重新整理，平常不擋畫面。 */
      ;(function () {
        var b = document.getElementById('appVerBadge')
        if (!b) return
        b.style.transition = 'opacity .8s'
        setTimeout(function () {
          b.style.opacity = '0'
          setTimeout(function () { b.style.display = 'none' }, 900)
        }, 10000)
      })()
    </script>
<script>
/* 🏷️ 版號徽章(0820 全艦隊批次):問「正在控制本頁的 SW」拿版本=你手上真的在跑的那一版,
   頁面不寫死任何版號(不會漂)。硬重整(Ctrl+F5)的分頁不受 SW 管、問不到 → 誠實顯示退路
   (股票管家 v134 同款);SW 換版接管時會再問,自動換新。 */
(function () {
  var el = document.getElementById('appVerBadge');
  if (!el || !('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  var got = false;
  navigator.serviceWorker.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'SW_VERSION') {
      got = true;
      var s = String(e.data.v), m = /-((?:v|nf)?\d+)$/.exec(s);
      el.textContent = '🏷️ 版本 ' + (m ? m[1] : s) + '(這台裝置實際執行中的版本)';
    }
  });
  function ask() { var c = navigator.serviceWorker.controller; if (c) c.postMessage('GET_VERSION'); }
  navigator.serviceWorker.ready.then(ask).catch(function () {});
  navigator.serviceWorker.addEventListener('controllerchange', ask);
  setTimeout(function () {
    if (got) return;
    if (!navigator.serviceWorker.controller) el.textContent = '🏷️ 版本 —(強制重新整理的分頁問不到;普通重整一次即顯示)';
    else { ask(); setTimeout(function () { if (!got) el.textContent = '🏷️ 版本 —(讀不到,重整一次即顯示)'; }, 1500); }
  }, 1600);
})();
</script>

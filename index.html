<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>參孫打獅子 · 士師記 14</title>

    <!-- PWA / 手機安裝 -->
    <meta name="theme-color" content="#7a4a22" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="參孫打獅子" />

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <button id="muteBtn" class="icon-btn mute-btn" aria-label="靜音" title="靜音 (M)">🔊</button>
      <button id="pauseBtn" class="icon-btn pause-btn" aria-label="暫停" title="暫停 (P)">⏸</button>
      <div id="overlay" class="overlay">
        <div class="card" id="card"></div>
      </div>
    </div>
    <!-- 手機直向時蓋住畫面,提示轉成橫向(只在觸控裝置的直向顯示) -->
    <div id="rotate" class="rotate-hint" aria-hidden="true">
      <div class="rotate-emoji">🔄</div>
      <p>請把手機轉成<b>橫向</b>來玩<br /><span>轉成橫向會自動全螢幕</span></p>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // play-stats 三層匿名計數(lobby-play-rank §3/§4):開啟 10 分去重;-start/-done 不去重;-done 帶 t=秒。零個資。
      window.psPing = function (key, t) {
        try {
          if (!location.hostname.endsWith('netlify.app')) return;
          var u = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=' + key + (t ? '&t=' + t : '');
          if (navigator.sendBeacon) navigator.sendBeacon(u); else fetch(u, { mode: 'no-cors' });
        } catch (_) {}
      };
      try {
        var psK = 'ps-last-samson';
        var psLast = parseInt(localStorage.getItem(psK) || '0', 10);
        if (Date.now() - psLast > 600000) { localStorage.setItem(psK, String(Date.now())); window.psPing('samson'); }
      } catch (_) { window.psPing('samson'); }
    </script>
  
<script>
// ← 返回大廳(skill back-to-lobby-button):孩子卡住要能離開。DOM 疊在畫面上,不畫進 canvas。
// 退出 ≠ 過關:這裡只導頁,絕不呼叫 onComplete。嵌入時先讓宿主處理。
(function () {
  var LOBBY = 'https://hfpc-bible-games.summer09201017.workers.dev';
  function go() {
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
    if (window.parent && window.parent !== window) {          // 嵌入:交給宿主收掉關卡視窗
      try { window.parent.postMessage({ type: 'hfpc-exit' }, '*'); } catch (e) {}
      if (history.length > 1) { history.back(); return; }
    }
    location.href = LOBBY;
  }
  function add() {
    if (document.querySelector('[data-hfpc-lobby]')) return;
    var b = document.createElement('button');
    b.textContent = '← 返回大廳';
    b.setAttribute('aria-label', '返回大廳');
    b.setAttribute('data-hfpc-lobby', '1');
    b.style.cssText = 'position:fixed;z-index:2147483000;' +
      'top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));' +
      'min-width:44px;min-height:44px;padding:9px 14px;border:0;border-radius:12px;' +
      'font:600 15px/1.2 system-ui,"Microsoft JhengHei",sans-serif;' +
      'background:rgba(0,0,0,.58);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent';
    b.addEventListener('click', go);
    (document.body || document.documentElement).appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', add); else add();
})();
</script>
</body>
</html>
